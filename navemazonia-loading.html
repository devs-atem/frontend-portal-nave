<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Navemazônia — Portal da Nave</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg-1: #0a2257;
    --bg-2: #041640;
    --gold: #f5b316;
    --gold-dark: #e08a00;
    --blue: #1e7ae6;
    --navy: #1d3361;
    --cabin: #d8dce3;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: 'Montserrat', system-ui, sans-serif;
    background: radial-gradient(ellipse at 50% 40%, var(--bg-1) 0%, var(--bg-2) 75%);
    color: #fff;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 0 16px;
  }

  /* ---------- Marca ---------- */
  .brand {
    display: flex;
    align-items: center;
    gap: clamp(12px, 2vw, 24px);
    opacity: 0;
    animation: fadeUp .9s ease-out .1s forwards;
  }
  .brand svg { width: clamp(34px, 3.6vw, 52px); height: auto; filter: drop-shadow(0 4px 14px rgba(245,179,22,.25)); }
  .brand h1 {
    font-weight: 800;
    font-size: clamp(20px, 3vw, 36px);
    letter-spacing: .14em;
    line-height: 1;
  }
  .tagline {
    margin-top: clamp(10px, 1.4vw, 16px);
    color: var(--gold);
    font-weight: 700;
    font-size: clamp(9px, .85vw, 12px);
    letter-spacing: .4em;
    padding-left: .4em;
    opacity: 0;
    animation: fadeUp .9s ease-out .3s forwards, pulse 2.4s ease-in-out 1.2s infinite;
  }

  /* ---------- Barco + ondas ---------- */
  .scene {
    position: relative;
    width: min(380px, 80vw);
    margin-top: clamp(24px, 4vh, 44px);
    aspect-ratio: 640 / 230;
  }
  .boat {
    position: absolute;
    left: 50%;
    bottom: 22%;
    width: 54%;
    transform-origin: 50% 85%;
    animation: bob 3.2s ease-in-out infinite;
  }
  .boat svg { width: 100%; height: auto; display: block; }

  .waves {
    position: absolute;
    left: 0; right: 0; bottom: 4%;
    width: 100%;
    height: 34%;
    -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
            mask-image: linear-gradient(90deg, transparent 0%, #000 22%, #000 78%, transparent 100%);
  }
  .waves svg { width: 100%; height: 100%; display: block; overflow: hidden; }
  .w-blue  { animation: drift 3.2s linear infinite; }
  .w-blue2 { animation: drift 4.6s linear infinite reverse; opacity: .55; }
  .w-gold  { animation: drift 2.6s linear infinite; }

  /* ---------- Onda do rodapé ---------- */
  .footer-wave {
    position: fixed;
    left: 0; right: 0; bottom: 0;
    height: 18vh;
    min-height: 110px;
    pointer-events: none;
  }
  .footer-wave svg { width: 100%; height: 100%; display: block; }
  .fw-fill { animation: driftLong 22s linear infinite; }
  .fw-gold { animation: driftLong 16s linear infinite; }
  .fw-blue { animation: driftLong 26s linear infinite reverse; }

  /* ---------- Keyframes ---------- */
  @keyframes bob {
    0%   { transform: translateX(-50%) translateY(0)    rotate(-2.5deg); }
    50%  { transform: translateX(-50%) translateY(-7px) rotate(2.5deg); }
    100% { transform: translateX(-50%) translateY(0)    rotate(-2.5deg); }
  }
  @keyframes drift     { from { transform: translateX(0); } to { transform: translateX(-160px); } }
  @keyframes driftLong { from { transform: translateX(0); } to { transform: translateX(-1600px); } }
  @keyframes fadeUp    { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
  @keyframes pulse     { 0%,100% { opacity: 1; } 50% { opacity: .55; } }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: 0s !important; animation-iteration-count: 1 !important; }
    .brand, .tagline { opacity: 1; }
  }
</style>
</head>
<body>

  <!-- Marca -->
  <div class="brand" aria-label="Navemazônia">
    <svg viewBox="0 0 100 100" aria-hidden="true">
      <defs>
        <radialGradient id="orb" cx="35%" cy="30%" r="75%">
          <stop offset="0%"  stop-color="#ffd25a"/>
          <stop offset="55%" stop-color="#f5a614"/>
          <stop offset="100%" stop-color="#c66d00"/>
        </radialGradient>
        <clipPath id="orbClip"><circle cx="50" cy="50" r="46"/></clipPath>
      </defs>
      <circle cx="50" cy="50" r="48" fill="#fff"/>
      <circle cx="50" cy="50" r="46" fill="url(#orb)"/>
      <g clip-path="url(#orbClip)">
        <path d="M0 70 C18 70 22 30 42 30 C60 30 58 66 74 66 C86 66 92 48 100 40 L100 56 C92 64 88 80 72 80 C52 80 54 46 42 46 C30 46 26 84 0 84 Z" fill="#fff"/>
      </g>
    </svg>
    <h1>NAVEMAZÔNIA</h1>
  </div>
  <p class="tagline">PORTAL DA NAVE</p>

  <!-- Barco e ondas -->
  <div class="scene" role="status" aria-label="Carregando">
    <div class="waves">
      <svg viewBox="0 0 640 80" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="goldFade" x1="0" x2="1">
            <stop offset="0" stop-color="#f5b316" stop-opacity=".2"/>
            <stop offset=".5" stop-color="#f5b316"/>
            <stop offset="1" stop-color="#f5b316" stop-opacity=".2"/>
          </linearGradient>
        </defs>
        <path class="w-blue2" d="M0 34 Q40 22 80 34 T160 34 T240 34 T320 34 T400 34 T480 34 T560 34 T640 34 T720 34 T800 34 T880 34"
              fill="none" stroke="#3b8cff" stroke-width="3" stroke-linecap="round"/>
        <path class="w-blue" d="M0 40 Q40 26 80 40 T160 40 T240 40 T320 40 T400 40 T480 40 T560 40 T640 40 T720 40 T800 40 T880 40"
              fill="none" stroke="#1e7ae6" stroke-width="6" stroke-linecap="round"/>
        <path class="w-gold" d="M0 46 Q40 60 80 46 T160 46 T240 46 T320 46 T400 46 T480 46 T560 46 T640 46 T720 46 T800 46 T880 46"
              fill="none" stroke="#f5b316" stroke-width="5" stroke-linecap="round"/>
      </svg>
    </div>

    <div class="boat">
      <svg viewBox="0 0 340 185" aria-hidden="true">
        <!-- Mastro -->
        <rect x="168" y="0" width="7" height="48" rx="2" fill="#f5b316"/>
        <rect x="152" y="12" width="40" height="6" rx="2" fill="#f5b316"/>
        <rect x="156" y="25" width="36" height="6" rx="2" fill="#f5b316"/>

        <!-- Teto da cabine -->
        <rect x="132" y="46" width="108" height="9" rx="2" fill="#2b4275"/>
        <!-- Cabine de comando -->
        <rect x="145" y="55" width="86" height="58" fill="#d8dce3"/>
        <rect x="154" y="64" width="17" height="24" fill="#1e7ae6"/>
        <rect x="178" y="64" width="17" height="24" fill="#1d3361"/>
        <rect x="202" y="64" width="17" height="24" fill="#1d3361"/>
        <path d="M186 113 V100 a10 10 0 0 1 20 0 V113" fill="none" stroke="#1d3361" stroke-width="4"/>

        <!-- Casa da proa -->
        <rect x="76" y="76" width="74" height="8" rx="2" fill="#f5b316"/>
        <rect x="82" y="84" width="64" height="30" fill="#d8dce3"/>
        <rect x="92" y="92" width="44" height="12" fill="#1e7ae6"/>

        <!-- Convés de popa -->
        <rect x="229" y="92" width="110" height="9" rx="2" fill="#f5b316"/>
        <rect x="231" y="101" width="102" height="16" fill="#d8dce3"/>
        <rect x="240" y="104" width="22" height="10" fill="#1d3361"/>
        <rect x="270" y="104" width="10" height="10" fill="#1d3361"/>
        <rect x="290" y="104" width="22" height="10" fill="#1d3361"/>

        <!-- Casco -->
        <path d="M6 78 Q36 96 120 110 L336 114 L326 164 Q200 180 58 170 Q34 128 6 78 Z" fill="#1d3361"/>
        <path d="M6 78 Q34 132 58 170" fill="none" stroke="#f5b316" stroke-width="5" stroke-linecap="round"/>
        <path d="M8 80 Q60 112 140 117 L336 117" fill="none" stroke="#f5b316" stroke-width="7" stroke-linecap="round"/>

        <!-- Âncora -->
        <g fill="none" stroke="#f5b316" stroke-width="4" stroke-linecap="round">
          <circle cx="66" cy="132" r="8"/>
          <line x1="66" y1="140" x2="66" y2="164"/>
          <line x1="57" y1="148" x2="75" y2="148"/>
          <path d="M54 156 Q58 166 66 166 Q74 166 78 156"/>
        </g>

        <!-- Escotilhas -->
        <g fill="none" stroke="#f5b316" stroke-width="4">
          <circle cx="255" cy="143" r="8"/>
          <circle cx="279" cy="143" r="8"/>
          <circle cx="303" cy="143" r="8"/>
        </g>
      </svg>
    </div>
  </div>

  <!-- Onda do rodapé -->
  <div class="footer-wave" aria-hidden="true">
    <svg viewBox="0 0 1600 200" preserveAspectRatio="none">
      <defs>
        <linearGradient id="fwFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#0d2a6e" stop-opacity=".9"/>
          <stop offset="1" stop-color="#041640" stop-opacity="1"/>
        </linearGradient>
      </defs>
      <path class="fw-fill" d="M0 90 C400 10 1200 170 1600 90 C2000 10 2800 170 3200 90 L3200 200 L0 200 Z" fill="url(#fwFill)"/>
      <path class="fw-blue" d="M0 70 C400 0 1200 150 1600 70 C2000 0 2800 150 3200 70"
            fill="none" stroke="#1e5fd0" stroke-width="2" opacity=".7"/>
      <path class="fw-gold" d="M0 88 C400 12 1200 168 1600 88 C2000 12 2800 168 3200 88"
            fill="none" stroke="#f5a614" stroke-width="2.5"/>
    </svg>
  </div>

</body>
</html>
