name: Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        description: "dev | prod"
        required: true
        type: string
      app_env:
        description: "VITE_APP_ENV do build (homologation | production)"
        required: true
        type: string
      api_url:
        required: false
        type: string
        default: ""

permissions:
  contents: read
  packages: read

jobs:
  deploy:
    name: Build & deploy (${{ inputs.environment }})
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Alinhado ao mise.toml
          node-version: "24.21.0"

      - run: corepack enable

      - name: Install dependencies
        env:
          GITHUB_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: yarn install --immutable

      - name: Build
        env:
          VITE_APP_ENV: ${{ inputs.app_env }}
          VITE_API_URL: ${{ inputs.api_url }}
        run: yarn build

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"
          terraform_wrapper: false

      - name: Terraform apply (S3 + CloudFront)
        working-directory: iac
        run: |
          terraform init -input=false -backend-config="key=portalnave/${{ inputs.environment }}.tfstate"
          terraform apply -input=false -auto-approve -var-file=${{ inputs.environment }}.tfvars
          echo "BUCKET=$(terraform output -raw bucket)" >> "$GITHUB_ENV"
          echo "DISTRIBUTION_ID=$(terraform output -raw distribution_id)" >> "$GITHUB_ENV"
          echo "CF_DOMAIN=$(terraform output -raw cloudfront_domain)" >> "$GITHUB_ENV"

      - name: Upload to S3
        run: |
          # Assets com hash: cache longo. index.html: sem cache.
          aws s3 sync ./dist "s3://$BUCKET/" --delete --exclude "index.html" \
            --cache-control "public,max-age=31536000,immutable"
          aws s3 cp ./dist/index.html "s3://$BUCKET/index.html" \
            --cache-control "no-cache,no-store,must-revalidate"

      - name: Invalidate CloudFront
        run: aws cloudfront create-invalidation --distribution-id "$DISTRIBUTION_ID" --paths "/*"

      - name: Summary
        run: echo "Deploy ok → CNAME aponta para $CF_DOMAIN" >> "$GITHUB_STEP_SUMMARY"
